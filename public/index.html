<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kural — Adaptive English Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo ta" aria-hidden="true">கு</span>
      <div>
        <div class="brand-name">Kural <span class="ta brand-ta">குரல்</span></div>
        <div class="brand-sub">Adaptive English tutor for Tamil speakers</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="learn" aria-selected="true">Learn</button>
      <button role="tab" data-view="dashboard" aria-selected="false">Dashboard</button>
      <button role="tab" data-view="decisions" aria-selected="false">Decisions</button>
      <button role="tab" data-view="counterfactual" aria-selected="false">Static vs adaptive</button>
      <button role="tab" data-view="sessions" aria-selected="false">Sessions</button>
      <button role="tab" data-view="eval" aria-selected="false">Evaluation</button>
    </nav>
    <span id="llmBadge" class="badge" title=""></span>
  </header>

  <main>
    <section id="view-learn" class="view" data-active="true">
      <div class="toolbar">
        <label class="field">Learner <input id="learnerName" value="Learner" maxlength="30"></label>
        <button id="newSession" class="btn">New session</button>
        <span class="sep" aria-hidden="true"></span>
        <label class="field">Demo learner
          <select id="persona">
            <option value="kavya">Kavya: knows it, can't say it</option>
            <option value="arun">Arun: a real gap + overload</option>
            <option value="meena">Meena: fluent</option>
          </select>
        </label>
        <label class="field">Speed
          <select id="speed"><option value="4">4×</option><option value="8" selected>8×</option><option value="16">16×</option></select>
        </label>
        <button id="runDemo" class="btn primary">▶ Play demo</button>
        <label class="toggle"><input type="checkbox" id="showModel" checked> Show model reasoning</label>
      </div>

      <div class="learn-grid" id="learnGrid">
        <div class="chat-panel">
          <div id="chat" class="chat" aria-live="polite"></div>
          <form id="composer" class="composer" autocomplete="off">
            <div class="composer-meta"><span id="modeChip"></span><span id="liveTel" class="live-tel"></span></div>
            <textarea id="input" rows="2" placeholder="Type your answer in English…" aria-label="Your answer"></textarea>
            <div class="composer-actions">
              <button type="button" id="hintBtn" class="btn ghost">Hint</button>
              <button type="button" id="skipBtn" class="btn ghost">Skip</button>
              <span class="grow"></span>
              <button type="submit" id="sendBtn" class="btn primary">Send</button>
            </div>
          </form>
        </div>
        <aside id="modelPanel" class="model-panel" aria-label="Model reasoning"></aside>
      </div>
    </section>

    <section id="view-dashboard" class="view"></section>
    <section id="view-decisions" class="view"></section>
    <section id="view-counterfactual" class="view"></section>
    <section id="view-sessions" class="view"></section>
    <section id="view-eval" class="view"></section>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
